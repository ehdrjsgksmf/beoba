<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    엔진이 어차피 같은 값을 넣는다. 여기 미리 두는 이유는 **기다리는 화면이
    엔진보다 먼저 그려지기 때문**이다. 이게 없으면 폰에서 980px 로 잡혀
    첫 화면 글자가 깨알만 해진다.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="법률 문제가 생겼을 때 오늘 뭘 해야 하는지 알려주는 앱">

  <!-- 앱 첫 화면 배경과 같은 값. 다르면 흰 화면이 한 번 번쩍인다. -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171B" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="버바">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>버바</title>
  <link rel="manifest" href="manifest.json">

  <!--
    기다리는 동안 보이는 화면.

    **Flutter 위젯으로 만들 수 없는 자리다.** 위젯은 엔진이 뜬 뒤에나 그려지는데
    우리가 가리려는 것이 바로 그 엔진을 기다리는 시간이다.

    바깥 파일을 하나도 부르지 않는다 — 그림·웹글꼴·아이콘 전부. 그걸 기다리면
    기다리는 화면이 늦게 떠서 만든 뜻이 없어진다. 글꼴은 시스템 글꼴이고
    표시는 CSS 도형 하나다.

    **로고를 새로 만들지 않았다.** 지금 아이콘이 아직 Flutter 기본값이라
    여기에 무엇을 그리든 그게 이 앱의 첫 마크가 되어 버린다. 마크가 생기면
    .beoba-stack 자리에 그대로 들어간다.

    **영영 도는 원을 두지 않는다.** 대신 8초·20초·40초에 한 줄씩 쌓인다.
    앞줄을 지우지 않는다 — 뒷줄만 남으면 왜 그러는지가 사라진다.

    **떠들썩하지 않게.** 여기 오는 분은 월급이 밀렸거나 보증금을 못 받았거나
    계좌가 정지된 분이다. 축제 같은 첫 화면은 그 자리에서 어긋난다.
    종이 넉 장이 아래에서 위로 조용히 쌓이는 것이 전부이고, 「차곡차곡
    담아온다」는 문구와 그림이 같은 말을 한다.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --beoba-bg: #FFFFFF;
      --beoba-ink: #1A1D21;
      --beoba-ink2: #4A5057;
      --beoba-ink3: #7B838C;
      --beoba-brand: #1F3A5F;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --beoba-bg: #14171B;
        --beoba-ink: #E8EAED;
        --beoba-ink2: #A8AEB6;
        --beoba-ink3: #8A9199;
        --beoba-brand: #7FA3CE;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--beoba-bg);
    }

    /*
      ★★ **여기는 opacity 0 에서 시작하지 않는다.** 페이드인을 넣지 않는다.

      예전에는 240ms 뒤에 220ms 동안 나타났다. 캐시가 있는 사람이 이 화면을
      아예 안 보고 지나가게 하려던 것인데, **그 대가가 너무 컸다.**

      크롬의 Paint Timing 은 opacity 0 으로 그려진 글자를 「안 그려진 것」으로
      센다. 그리고 그 뒤의 opacity 변화는 합성 스레드가 처리해서 **새 페인트
      기록을 안 남긴다.** 그래서 글자는 0.24초에 눈앞에 있는데 지표는 영영
      안 찍히다가, 나중에 진짜 새 페인트가 생길 때(8초 타이머가 글줄을 넣거나
      Flutter 가 캔버스를 그릴 때) 그제야 찍혔다.

      ```
      사람이 보는 시각   0.24초   (스크린숏으로 확인)
      기계가 적는 시각   8.5초    (first-contentful-paint)
      ```

      **우리 도구만의 문제가 아니다.** Lighthouse 도 실사용자 지표(CrUX)도 같은
      API 를 쓴다. 기관 담당자가 링크를 재 보면 8초가 나온다 — 실제로는
      0.7초인데. 페이드 하나의 값으로는 너무 비싸다(DECISIONS 266번).

      ★ **지표가 우리 편이 되게 숫자를 만지지 않았다.** opacity 를 0.01 로
      두면 지표는 통과하는데 사람은 여전히 아무것도 못 본다. 그건 지표에
      거짓말을 시키는 것이다. **화면이 진짜로 처음부터 보이게 고쳤다.**

      빠른 사람에게 번쩍이지 않느냐 — 배경색이 앱 첫 화면과 같아서 바뀌는
      것은 글자뿐이고, 240ms 안에 끝나면 아래 hide() 가 페이드 없이 그냥
      지운다.
    */
    #beoba-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--beoba-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #beoba-splash.is-leaving {
      animation: beoba-splash-out 150ms ease-in forwards;
    }

    @keyframes beoba-splash-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .beoba-splash-inner {
      max-width: 20rem;
      padding: 0 1.5rem;
      text-align: center;
    }

    /*
      종이 넉 장이 아래에서 위로 하나씩 쌓인다. 2.8초에 한 바퀴.

      도는 것이 아니다. 28초 걸리는 연결에서 아무것도 안 움직이면 멈춘
      화면으로 읽히는데, 도는 원은 「기다려라」만 말하고 쌓이는 종이는
      **무엇을 하고 있는지**를 말한다.
    */
    .beoba-stack {
      position: relative;
      width: 44px;
      height: 34px;
      margin: 0 auto 20px;
    }

    .beoba-stack i {
      position: absolute;
      left: 0;
      display: block;
      height: 4px;
      border-radius: 2px;
      background: var(--beoba-brand);
      opacity: 0;
      animation: beoba-stack-in 2800ms ease-out infinite;
    }

    /* 아래가 먼저, 위가 나중. 폭을 조금씩 달리해 종이 더미로 읽히게 한다. */
    .beoba-stack i:nth-child(1) { bottom: 0;  width: 44px; animation-delay: 0ms; }
    .beoba-stack i:nth-child(2) { bottom: 10px; width: 38px; animation-delay: 260ms; }
    .beoba-stack i:nth-child(3) { bottom: 20px; width: 42px; animation-delay: 520ms; }
    .beoba-stack i:nth-child(4) { bottom: 30px; width: 30px; animation-delay: 780ms; }

    @keyframes beoba-stack-in {
      0%   { opacity: 0; transform: translateY(7px); }
      12%  { opacity: 0.85; transform: translateY(0); }
      72%  { opacity: 0.85; transform: translateY(0); }
      92%  { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }

    .beoba-splash-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      line-height: 1.5;
      color: var(--beoba-ink);
    }

    .beoba-splash-sub {
      margin: 8px 0 0;
      font-size: 13.5px;
      letter-spacing: -0.2px;
      line-height: 1.5;
      color: var(--beoba-ink3);
    }

    .beoba-splash-note {
      margin: 22px 0 0;
      font-size: 13.5px;
      letter-spacing: -0.2px;
      line-height: 1.6;
      color: var(--beoba-ink2);
      min-height: 1.6em;
      white-space: pre-line;
    }

    /*
      움직임을 줄여 달라고 한 사람에게는 숨쉬기를 멈추고 나가는 페이드도 없앤다.
      들어오는 페이드는 이제 아무에게도 없다 — 위를 보라.
    */
    @media (prefers-reduced-motion: reduce) {
      #beoba-splash.is-leaving {
        animation-duration: 1ms;
      }

      /*
        움직이지 않는 대신 **넉 장을 다 쌓아 둔다.** 애니메이션만 끄면
        opacity 가 0 인 채로 남아 그림이 아예 사라진다.
      */
      .beoba-stack i {
        animation: none;
        opacity: 0.85;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="beoba-splash">
    <div class="beoba-splash-inner">
      <div class="beoba-stack" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
      <p class="beoba-splash-title">버바를 여는 중이에요</p>
      <p class="beoba-splash-sub">법에 적힌 것만 알려드려요</p>
      <p class="beoba-splash-note" id="beoba-splash-note" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      var splash = document.getElementById('beoba-splash');
      var note = document.getElementById('beoba-splash-note');
      if (!splash) return;

      // 이만큼도 못 머물고 끝나면 페이드아웃이 오히려 한 번 번쩍인다.
      // 그때는 그냥 지운다. **나타나는 시각이 아니라 머문 시간이다** —
      // 이 화면은 이제 첫 프레임부터 보인다.
      var STAY_MIN = 240;
      var FADE_MS = 150;
      var born = Date.now();
      var timers = [];

      // **앞줄을 지우지 않고 아래에 쌓는다.** 뒷줄만 남으면 왜 그러는지가
      // 사라진다.
      //
      // ★ 「새로고침」이라는 낱말을 쓰지 않는다. 사용자가 무언가 해야 하는
      //   상황으로 읽힌다. 실제로는 가만히 있으면 열린다 — 느린 4G 에서
      //   28초가 걸릴 뿐이다. 마지막 줄이 그 사실을 말한다.
      var lines = [];

      function addLine(ms, text) {
        timers.push(setTimeout(function () {
          lines.push(text);
          note.textContent = lines.join('\n');
        }, ms));
      }

      addLine(8000, '도움 될 만한 정보를 차곡차곡 담아오고 있어요');
      addLine(20000, '거의 다 왔어요. 조금만요');
      addLine(40000, '망이 느린 것 같아요. 그대로 두셔도 열립니다');

      function hide() {
        if (!splash || !splash.parentNode) return;
        timers.forEach(clearTimeout);

        if (Date.now() - born < STAY_MIN) {
          splash.parentNode.removeChild(splash);
          splash = null;
          return;
        }

        splash.classList.add('is-leaving');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          splash = null;
        }, FADE_MS);
      }

      // **진입점이 아니라 첫 프레임이다.** 진입점만 보고 지우면 앱이 아직
      // 아무것도 안 그린 상태라 흰 화면이 한 번 낀다.
      window.addEventListener('flutter-first-frame', hide);
    })();
  </script>
</body>
</html>
