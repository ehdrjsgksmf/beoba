name: beoba
description: 버바 — 법률 문제가 생겼을 때 오늘 뭘 해야 하는지 알려주는 앱.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  domain_data:
    path: ../../packages/domain_data
  engines:
    path: ../../packages/engines
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  # 기기에 남기는 것은 「세도 되는지」 답 하나뿐이다.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 도메인 JSON 은 domain_data 패키지가 소유한다.
  # 로드 경로: packages/domain_data/assets/domains/<id>.json
  #
  # 개인정보처리방침만 앱이 소유한다. 분야 데이터가 아니라 **이 앱이 하는
  # 약속**이라서다. 손으로 쓰지 않는다 — docs/개인정보처리방침.md 에서
  # build_privacy_page.dart 가 굽는다.
  assets:
    - assets/policy/
