<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>전세 사건 AI 법률심리</title>
<style>
:root{
  --ink:#1a1d21; --ink2:#4a5057; --ink3:#7b838c;
  --line:#e3e6ea; --line2:#eef0f3;
  --bg:#ffffff; --card:#ffffff;
  --brand:#1f3a5f; --brand2:#2d5586; --brandsoft:#eef3f9;
  --green:#0f7b4f; --greensoft:#e8f5ee; --greenline:#b8dfc9;
  --amber:#a86500; --ambersoft:#fdf3e0; --amberline:#f0d9a8;
  --red:#b02a1e; --redsoft:#fdeceb; --redline:#f3c4bf;
  --radius:14px;
  --top:calc(52px + env(safe-area-inset-top,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
  font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased;
  padding-top:var(--top);
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  overscroll-behavior-y:none;
}
button{touch-action:manipulation;font-family:inherit}

/* ── 고정 상단바 ── */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:60;
  background:rgba(255,255,255,.96); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top,0px) 14px 0;
  height:var(--top);
  display:flex; align-items:center; gap:10px;
}
.topbar .back{
  width:34px;height:34px;border:none;background:none;font-size:20px;color:var(--brand);
  cursor:pointer;padding:0;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
}
.topbar .back[hidden]{display:none}
.topbar .t{font-size:15px;font-weight:700;letter-spacing:-.3px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .step{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ── 본문 ── */
main{padding:18px 16px 30px;max-width:560px;margin:0 auto}

h2.sh{font-size:23px;margin:0 0 10px;letter-spacing:-.6px;line-height:1.36}
h3.ss{font-size:16px;margin:26px 0 10px;letter-spacing:-.3px}
p.body{font-size:15.5px;color:var(--ink2);margin:0 0 14px}
p.small{font-size:13.5px;color:var(--ink3);margin:0 0 12px;line-height:1.6}
.center{text-align:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.tier{border-radius:var(--radius);padding:15px 16px;margin-bottom:11px;font-size:15px;line-height:1.62}
.tier .lb{font-size:12.5px;font-weight:800;margin-bottom:8px;display:block}
.t-green{background:var(--greensoft);border:1px solid var(--greenline)}
.t-green .lb{color:var(--green)}
.t-amber{background:var(--ambersoft);border:1px solid var(--amberline)}
.t-amber .lb{color:var(--amber)}
.t-red{background:var(--redsoft);border:1px solid var(--redline)}
.t-red .lb{color:var(--red)}
.quote{
  font-size:14.5px;color:var(--ink2);background:rgba(255,255,255,.75);
  border-left:3px solid rgba(0,0,0,.13);padding:11px 13px;border-radius:0 8px 8px 0;margin:10px 0;line-height:1.66;
}
.srclink{display:inline-block;font-size:14px;color:var(--brand2);font-weight:600;margin-top:9px;
  text-decoration:none;border-bottom:1px solid #c3d3e5;padding:4px 0;min-height:30px}
.verified{font-size:13px;color:var(--green);font-weight:700;margin-top:8px;display:block}

.why{background:var(--brandsoft);border:1px solid #d5e2f0;border-radius:12px;
  padding:14px;font-size:14.5px;color:#2c4a70;margin-top:18px;line-height:1.62}
.why b{display:block;margin-bottom:5px;font-size:14px;color:var(--brand)}

.notice{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;
  padding:14px;font-size:13.5px;color:var(--ink3);line-height:1.65;margin:14px 0}
.notice b{color:var(--ink2)}
.ailabel{display:inline-flex;align-items:center;gap:5px;background:#f0f2f5;border:1px solid var(--line);
  color:var(--ink3);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:20px;margin-bottom:14px}

/* ── 버튼 (탭 타깃 최소 48px) ── */
.btn{display:block;width:100%;min-height:52px;padding:15px;border-radius:13px;border:none;cursor:pointer;
  font-size:17px;font-weight:700;margin-top:11px;letter-spacing:-.3px;background:var(--brand);color:#fff}
.btn:active{filter:brightness(1.2)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid #cdd8e5}
.btn.quiet{background:#f2f4f6;color:var(--ink2);font-size:15px;font-weight:600}
.btn.danger{background:var(--red)}
.linkrow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:50px;
  background:none;border:none;padding:13px 0;font-size:15px;color:var(--brand2);font-weight:600;
  cursor:pointer;border-bottom:1px solid var(--line2);text-align:left;gap:10px}

.choice{display:flex;align-items:center;gap:13px;width:100%;min-height:56px;background:#fff;
  border:1.5px solid var(--line);border-radius:13px;padding:15px 16px;margin-bottom:10px;
  font-size:16px;color:var(--ink);cursor:pointer;text-align:left}
.choice:active{background:#f4f6f8}
.choice.on{border-color:var(--brand);border-width:2px;background:var(--brandsoft);font-weight:700}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #c3c9d0;flex:0 0 auto}
.choice.on .dot{border-color:var(--brand);border-width:6px}

.prog{margin-bottom:18px}
.progtop{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);
  margin-bottom:7px;font-variant-numeric:tabular-nums}
.progbar{height:6px;background:#e9ecef;border-radius:3px;overflow:hidden}
.progfill{height:100%;background:var(--brand);border-radius:3px}
.gauge{height:11px;background:#e9ecef;border-radius:6px;overflow:hidden;margin:10px 0 8px}
.gaugefill{height:100%;background:var(--green);border-radius:6px}

.facts{width:100%;border-collapse:collapse;font-size:14.5px}
.facts td{padding:9px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.facts td:first-child{color:var(--ink3);width:44%}
.facts td:last-child{text-align:right;font-weight:600}
.facts tr:last-child td{border-bottom:none}

.tl{position:relative;padding-left:22px;margin-top:8px}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tlitem{position:relative;padding-bottom:18px;font-size:14.5px}
.tlitem::before{content:'';position:absolute;left:-21px;top:6px;width:10px;height:10px;
  border-radius:50%;background:#c3c9d0;border:2px solid #fff}
.tlitem.now::before{background:var(--red);width:12px;height:12px;left:-22px}
.tld{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tlt{font-weight:600;margin-top:1px}

.todo{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line2)}
.chk{width:26px;height:26px;border:2px solid #c3c9d0;border-radius:7px;flex:0 0 auto;
  cursor:pointer;position:relative}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on::after{content:'✓';position:absolute;top:-2px;left:5px;color:#fff;font-size:17px;font-weight:800}
.todot{font-size:16px;font-weight:600}
.todos{font-size:13.5px;color:var(--ink3);margin-top:2px}

.opt{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;cursor:pointer;text-align:left}
.opt:active{background:#f7f9fb}
.opt.primary{border-color:#bcd0e6;background:linear-gradient(180deg,#f8fbff 0%,#fff 100%)}
.optt{font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-.4px}
.optd{font-size:14.5px;color:var(--ink2);line-height:1.55}
.optgo{font-size:14px;color:var(--brand2);font-weight:700;margin-top:11px;display:block}

.stepbox{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:#fff}
.stephd{background:#f7f8fa;padding:13px 15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stepn{background:var(--brand);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px}
.stept{font-size:16px;font-weight:700;letter-spacing:-.3px}
.stepbd{padding:15px}

.ev{width:100%;border-collapse:collapse;font-size:14.5px}
.ev th{text-align:left;font-size:12.5px;color:var(--ink3);font-weight:600;padding:0 0 8px;border-bottom:1px solid var(--line)}
.ev td{padding:11px 0;border-bottom:1px solid var(--line2)}
.ev td:nth-child(2),.ev td:nth-child(3){text-align:center;width:56px}

.formmock{border:2px dashed #c8ced6;border-radius:12px;padding:15px;background:#fafbfc;font-size:14px}
.frow{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.flab{color:var(--ink3);flex:0 0 92px;font-size:13px}
.fbox{flex:1;height:34px;background:#fff;border:1px solid var(--line);border-radius:7px}

.costbox{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.costhd{background:#f7f8fa;padding:12px 15px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
.costrow{display:flex;justify-content:space-between;gap:10px;padding:12px 15px;font-size:15px;border-bottom:1px solid var(--line2)}
.costrow:last-child{border-bottom:none}
.costrow.total{background:#fafbfc;font-weight:800;color:var(--brand)}
.costrow .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{border:2px dashed #c8ced6;border-radius:var(--radius);padding:26px 18px;text-align:center;
  background:#fafbfc;color:var(--ink3);font-size:14.5px;line-height:1.68}

.vs{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px;font-size:15px}
.vshd{font-size:14px;font-weight:800;color:var(--ink3);margin-bottom:8px}
.claim{font-size:16px;font-weight:700;margin-bottom:9px;letter-spacing:-.3px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:9px}
.tag.said{background:var(--ambersoft);color:var(--amber);border:1px solid var(--amberline)}
.tag.notyet{background:#f0f2f5;color:var(--ink3);border:1px solid var(--line)}
.fact{font-size:14.5px;color:var(--ink2);padding:4px 0}

.checkline{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:11px 0;border-bottom:1px solid var(--line2)}
.checkline:last-child{border-bottom:none}
.ok{color:var(--green);font-weight:700}

.risk{border-radius:var(--radius);padding:17px;margin-bottom:14px}
.risk.amber{background:var(--ambersoft);border:1px solid var(--amberline)}
.risk.red{background:var(--redsoft);border:1px solid var(--redline)}
.riskt{font-size:18px;font-weight:800;margin-bottom:8px}
.risk.amber .riskt{color:var(--amber)}
.risk.red .riskt{color:var(--red)}

.casecard{background:linear-gradient(135deg,#1f3a5f 0%,#2d5586 100%);color:#fff;
  border-radius:var(--radius);padding:19px;margin-bottom:14px}
.casecard .cn{font-size:19px;font-weight:800;margin-bottom:4px;letter-spacing:-.4px}
.casecard .cm{font-size:14.5px;opacity:.84;margin-bottom:15px}
.casecard .pb{height:7px;background:rgba(255,255,255,.24);border-radius:4px;overflow:hidden}
.casecard .pf{height:100%;background:#fff;border-radius:4px}
.casecard .pl{font-size:13px;opacity:.86;margin-top:7px;display:flex;justify-content:space-between}

.pill{display:inline-block;background:#f0f2f5;border:1px solid var(--line);border-radius:6px;
  padding:2px 9px;font-size:13px;color:var(--ink2);font-weight:600}

/* ── 하단 도구바 ── */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:rgba(255,255,255,.97); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex; gap:8px;
}
.dock button{
  flex:1; min-height:46px; border:1px solid var(--line); background:#f7f8fa; border-radius:11px;
  font-size:14px; font-weight:700; color:var(--ink2); cursor:pointer;
}
.dock button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── 시트 ── */
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:70;
  background:#fff; border-radius:20px 20px 0 0; box-shadow:0 -6px 34px rgba(0,0,0,.2);
  max-height:76vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  transform:translateY(102%); transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));
}
.sheet.open{transform:translateY(0)}
.sheethd{position:sticky;top:0;background:#fff;padding:14px 0 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;z-index:2}
.grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;background:#d5d9de;border-radius:3px}
.sheethd h3{margin:0;font-size:16px;flex:1;letter-spacing:-.3px}
.sheethd .x{width:34px;height:34px;border:none;background:#f2f4f6;border-radius:50%;font-size:17px;color:var(--ink3);cursor:pointer}
.sheetbd{padding:14px 0;font-size:14.5px;color:var(--ink2);line-height:1.72}
.sheetbd b{color:var(--ink)}
.sheetbd ul{margin:10px 0 0;padding-left:19px}
.sheetbd li{margin-bottom:9px}
.navlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 0}
.navlist button{min-height:54px;background:#f7f8fa;border:1px solid var(--line);border-radius:11px;
  padding:9px 11px;font-size:13.5px;color:var(--ink2);cursor:pointer;text-align:left;line-height:1.35}
.navlist button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.navlist .k{display:block;font-size:11.5px;opacity:.72;font-weight:700;margin-bottom:2px}
.scrim{position:fixed;inset:0;background:rgba(15,20,28,.42);z-index:65;opacity:0;pointer-events:none;transition:opacity .26s}
.scrim.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>

<header class="topbar">
  <button class="back" id="back" onclick="goBack()" hidden>‹</button>
  <span class="t" id="barTitle">전세금 사건</span>
  <span class="step" id="barStep"></span>
</header>

<main id="screen"></main>

<div class="scrim" id="scrim" onclick="closeSheets()"></div>

<div class="sheet" id="navSheet">
  <div class="sheethd"><span class="grab"></span><h3>화면 바로가기</h3>
    <button class="x" onclick="closeSheets()">✕</button></div>
  <div class="navlist" id="navlist"></div>
</div>

<div class="sheet" id="noteSheet">
  <div class="sheethd"><span class="grab"></span><h3 id="noteTitle">설계 의도</h3>
    <button class="x" onclick="closeSheets()">✕</button></div>
  <div class="sheetbd" id="noteBody"></div>
</div>

<nav class="dock">
  <button id="dNav" onclick="openSheet('navSheet')">☰ 화면 목록</button>
  <button id="dNote" onclick="openSheet('noteSheet')">💡 설계 의도</button>
</nav>

<script>
var state = { todo:[false,false,false] };
var S = {};

/* ── S0 ── */
S.s0 = { bar:'전세금 사건', step:'', nav:'S0', navlabel:'진입·고지',
note:'<b>AI기본법 제31조 제1항</b>의 사전 고지를 하단 회색 작은 글씨가 아니라 <b>첫 화면 본문</b>에 넣었습니다.<ul><li>"승소 가능성은 안내하지 않습니다"를 기능 소개 자리에 배치 — 못 하는 걸 숨기지 않고 특징으로 내세움</li><li>다루는 범위를 처음부터 명시해 범위 밖 사용자의 이탈을 유도 (좋은 이탈)</li><li>"이미 만든 사건이 있어요"가 재방문 진입점 — 이게 GPT에 없는 것</li></ul>',
html:`
<div style="text-align:center;padding:22px 0 10px">
  <div style="font-size:60px;line-height:1">⚖️</div>
  <h2 class="sh" style="margin-top:18px">전세금, 못 받으셨나요</h2>
  <p class="body">지금부터 무엇을 해야 하는지<br>하나씩 정리해 드립니다.</p>
</div>
<div class="card" style="background:#f7f8fa">
  <div style="font-size:15px;font-weight:800;margin-bottom:10px">🤖 이 서비스는 AI를 사용합니다</div>
  <div style="font-size:14.5px;color:var(--ink2);line-height:1.8">
    · 법률 상담이 아니라 <b>정보 정리 도구</b>입니다<br>
    · 모든 법률 정보에 <b>법령 원문 링크</b>를 붙입니다<br>
    · 확인되지 않은 것은 <b>"모른다"고 표시</b>합니다<br>
    · <b>승소 가능성은 안내하지 않습니다</b>
  </div>
</div>
<div class="tier t-green">
  <span class="lb">현재 다루는 사건</span>
  🏠 주택 전세 · 보증부월세<br><b>계약 종료 후 보증금 미반환</b>
  <div style="font-size:13.5px;color:var(--ink3);margin-top:9px">그 외 사건은 아직 다루지 않습니다</div>
</div>
<button class="btn" onclick="go('s1')">시작하기</button>
<button class="btn quiet" onclick="go('s12')">이미 만든 사건이 있어요 →</button>` };

/* ── S1 ── */
S.s1 = { bar:'사건 진술', step:'1 / 6', nav:'S1', navlabel:'사건 진술',
note:'<b>🎤 음성 입력이 접근성의 핵심입니다.</b> 긴 글을 타이핑하기 어려운 고령·저학력 사용자가 주 타깃이라면 없으면 안 되는 기능입니다.<ul><li>개인정보 마스킹 고지를 <b>입력창 바로 아래</b> 배치 — 제출 전에 봐야 의미가 있음</li><li>내부 처리: 개인정보 마스킹 → 하드스톱 키워드 스캔(고소·사기·경찰·소장·경매·상속) → 사건 유형 분류</li></ul>',
html:`
<h2 class="sh">무슨 일이 있었는지<br>편하게 말씀해 주세요</h2>
<p class="body">법률 용어를 쓰지 않으셔도 됩니다.</p>
<div class="card" style="min-height:150px;font-size:15.5px;color:var(--ink2);line-height:1.72">
  작년에 전세 5천만원으로 들어갔는데 계약이 6월에 끝났어요. 집주인이 새 세입자 구하면 준다고만 하고 두 달째 안 줍니다.
</div>
<div style="display:flex;gap:9px;margin:12px 0">
  <button class="btn quiet" style="margin:0">🎤 말로 하기</button>
  <button class="btn quiet" style="margin:0">📷 사진 첨부</button>
</div>
<div class="notice">🔒 <b>이름·주소·연락처는 자동으로 가려서</b> 처리합니다.<br>상담 내용은 AI 학습에 사용하지 않습니다.</div>
<button class="btn" onclick="go('s2a')">다음</button>` };

/* ── 인터뷰 공통 ── */
function qs(n,score,q,opts,why,next){

/* ═══ 라우팅 ═══ */
var ORDER = ['s0','s1','s2a','s2b','s2c','s2d','warn','s3','s4','s5','s6','s7','s8','s9','s9b','s10','s11','s12','s98','s99'];
var hist = [];

function go(id, isBack){
  var s = S[id]; if(!s) return;
  if(!isBack && hist[hist.length-1] !== id) hist.push(id);
  document.getElementById('barTitle').textContent = s.bar;
  document.getElementById('barStep').textContent = s.step || '';
  document.getElementById('screen').innerHTML = s.html;
  document.getElementById('noteTitle').textContent = s.navlabel;
  document.getElementById('noteBody').innerHTML = s.note;
  document.getElementById('back').hidden = hist.length < 2;
  var ns = document.querySelectorAll('.navlist button');
  for(var i=0;i<ns.length;i++) ns[i].className = (ns[i].getAttribute('data-id')===id ? 'on' : '');
  for(var j=0;j<3;j++){ var e=document.getElementById('c'+j); if(e && state.todo[j]) e.className='chk on'; }
  window.scrollTo(0,0);
  closeSheets();
}
function goBack(){ hist.pop(); var p = hist[hist.length-1]; if(p) go(p, true); }
function pick(el){
  var cs = el.parentElement.querySelectorAll('.choice');
  for(var i=0;i<cs.length;i++) cs[i].className='choice';
  el.className='choice on';
}
function tog(i){
  state.todo[i] = !state.todo[i];
  document.getElementById('c'+i).className = state.todo[i] ? 'chk on' : 'chk';
}
function openSheet(id){
  var already = document.getElementById(id).classList.contains('open');
  closeSheets();
  if(already) return;
  document.getElementById(id).classList.add('open');
  document.getElementById('scrim').classList.add('on');
  document.getElementById(id==='navSheet'?'dNav':'dNote').classList.add('on');
}
function closeSheets(){
  document.getElementById('navSheet').classList.remove('open');
  document.getElementById('noteSheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('dNav').classList.remove('on');
  document.getElementById('dNote').classList.remove('on');
}

var nl = document.getElementById('navlist');
for(var i=0;i<ORDER.length;i++){
  (function(id){
    var b = document.createElement('button');
    b.setAttribute('data-id', id);
    b.innerHTML = '<span class="k">'+S[id].nav+'</span>'+S[id].navlabel;
    b.onclick = function(){ go(id); };
    nl.appendChild(b);
  })(ORDER[i]);
}

go('s0');
